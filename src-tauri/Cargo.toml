[package]
name = "mdnote"
version = "0.1.0"
description = "WYSIWYG Markdown editor"
authors = ["yoshida"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
trash = "5"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", features = ["json"] }
keyring = "4.2.0"

# PDF の書き出しに WebKitGTK の印刷機能を直接使う (Tauri が使っているものと同じ版)
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"
glib = "0.18"
